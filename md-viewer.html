  <style>
    /* ==================== テーマ変数 ==================== */
    /* UI（ヘッダー・目次）の配色は端末のライト/ダーク設定に追従させる。
       理由: Chrome はタブレット幅ではステータスバーのアイコン色を端末設定で決めるため、
       ステータスバー色（theme-color）と UI 色を端末設定に合わせて一体化させる。
       本文の配色（--bg/--fg）はアプリ内の切替ボタンで独立に選べる。 */
    :root {
      --ui-bg: #1f2733;
      --ui-bg-soft: #2a3340;
      --ui-border: #3a4757;
      --ui-text: #c3ccd8;
      --ui-text-dim: #8a96a5;
      --ui-hover-bg: #3a4757;
      --ui-hover-text: #fff;
      --ui-active-bg: #4a5666;
      --accent: #e0506e;
      --open: #2e8b57;
      --open-text: #eafff1;
      --open-hover: #36a368;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --ui-bg: #e8ecf1;
        --ui-bg-soft: #d6dce4;
        --ui-border: #c3ccd8;
        --ui-text: #1f2733;
        --ui-text-dim: #4a5666;
        --ui-hover-bg: #c3ccd8;
        --ui-hover-text: #1f2733;
        --ui-active-bg: #b1bbc8;
      }
    }

    /* ライト（紙のような）テーマ */
    html[data-theme="light"] {
      --bg: #faf8f5;
      --fg: #2b2b2b;
      --fg-soft: #555;
      --fg-faint: #8a8a86;
      --heading: #1a1a1a;
      --rule: #e3ddd3;
      --rule-soft: #ece7de;
      --code-bg: #f0ece4;
      --code-fg: #b5305a;
      --pre-bg: #f3efe8;
      --pre-fg: #2b2b2b;
      --quote-bar: #d8b24a;
      --quote-fg: #5f5a50;
      --link: #1565c0;
      --th-bg: #f0ece4;
      --selection: #ffe5b0;
      --scroll-track: #efeae1;
      --scroll-thumb: #d3ccbf;
      --scroll-thumb-h: #bdb4a3;
    }

    /* ダーク（改善）テーマ */
    html[data-theme="dark"] {
      --bg: #1e1e1e;
      --fg: #d8d8d2;
      --fg-soft: #b0b0aa;
      --fg-faint: #807d77;
      --heading: #ffffff;
      --rule: #3a3a3a;
      --rule-soft: #2f2f2f;
      --code-bg: #2d2d2d;
      --code-fg: #ff8aa8;
      --pre-bg: #262626;
      --pre-fg: #e4e4de;
      --quote-bar: #d8b24a;
      --quote-fg: #aaa49a;
      --link: #6cb6ff;
      --th-bg: #2a2a2a;
      --selection: #4a3f1e;
      --scroll-track: #262626;
      --scroll-thumb: #3f3f3f;
      --scroll-thumb-h: #555;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
      background: var(--bg);
      color: var(--fg);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      transition: background-color .2s ease, color .2s ease;
    }

    ::selection { background: var(--selection); }

    /* ==================== ヘッダー ==================== */
    .header {
      display: flex;
      align-items: center;
      background: var(--ui-bg);
      border-bottom: 1px solid var(--ui-border);
      min-height: 42px;
    }

    .tab-bar {
      display: flex;
      flex: 1;
      overflow-x: auto;
      min-height: 42px;
      -webkit-overflow-scrolling: touch;
    }

    .tab-bar::-webkit-scrollbar { height: 4px; }
    .tab-bar::-webkit-scrollbar-thumb { background: var(--ui-border); border-radius: 2px; }

    .file-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: transparent;
      border: none;
      border-right: 1px solid var(--ui-border);
      color: var(--ui-text-dim);
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      min-width: 120px;
      max-width: 200px;
      height: 42px;
    }

    .file-tab:hover { background: var(--ui-bg-soft); color: var(--ui-text); }

    .file-tab.active {
      background: var(--bg);
      color: var(--fg);
      border-bottom: 2px solid var(--accent);
    }

    .tab-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
      pointer-events: none;
    }

    .tab-name-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--accent);
      color: var(--fg);
      padding: 2px 4px;
      font-size: 13px;
      border-radius: 3px;
      outline: none;
      width: 100%;
    }

    .tab-close {
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 14px;
      line-height: 1;
      opacity: 0.5;
      background: transparent;
      border: none;
      color: inherit;
      cursor: pointer;
    }

    .tab-close:hover { opacity: 1; background: var(--accent); color: #fff; }

    .tab-add {
      padding: 0 16px;
      background: transparent;
      border: none;
      color: var(--ui-text-dim);
      font-size: 18px;
      cursor: pointer;
      height: 42px;
      flex-shrink: 0;
    }

    .tab-add:hover { color: var(--ui-hover-text); background: var(--ui-bg-soft); }

    .mode-switcher {
      display: flex;
      gap: 4px;
      padding: 0 12px;
      align-items: center;
      flex-shrink: 0;
    }

    .mode-btn {
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      background: var(--ui-bg-soft);
      color: var(--ui-text-dim);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .mode-btn:hover { background: var(--ui-hover-bg); color: var(--ui-hover-text); }
    .mode-btn.active { background: var(--accent); color: #fff; }
    #openBtn { background: var(--open); color: var(--open-text); }
    #openBtn:hover { background: var(--open-hover); color: #fff; }
    .mode-btn svg { display: block; }

    .toc-toggle {
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      background: var(--ui-bg-soft);
      color: var(--ui-text-dim);
      font-size: 12px;
      cursor: pointer;
      margin-right: 4px;
      white-space: nowrap;
    }

    .toc-toggle:hover { background: var(--ui-hover-bg); color: var(--ui-hover-text); }
    .toc-toggle.active { background: var(--ui-active-bg); color: var(--ui-hover-text); }
    .toc-toggle.hidden { display: none; }

    #fileInput { display: none; }

    /* ==================== メイン ==================== */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* TOCサイドバー */
    .toc-sidebar {
      width: 240px;
      background: var(--ui-bg);
      border-right: 1px solid var(--ui-border);
      overflow-y: auto;
      padding: 12px 8px;
      flex-shrink: 0;
    }

    .toc-sidebar.hidden { display: none; }

    .toc-title {
      font-size: 11px;
      color: var(--ui-text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 8px 8px;
      border-bottom: 1px solid var(--ui-border);
      margin-bottom: 8px;
    }

    .toc-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .toc-list li {
      margin: 0;
      padding: 0;
    }

    .toc-list a {
      display: block;
      padding: 6px 8px;
      color: var(--ui-text);
      text-decoration: none;
      font-size: 12.5px;
      border-radius: 4px;
      line-height: 1.45;
      word-break: break-word;
    }

    .toc-list a:hover {
      background: var(--ui-bg-soft);
      color: var(--ui-hover-text);
    }

    .toc-empty {
      color: var(--ui-text-dim);
      font-size: 12px;
      padding: 8px;
      font-style: italic;
    }

    /* コンテンツエリア */
    .content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* textarea (貼り付けモード) */
    .editor {
      flex: 1;
      width: 100%;
      padding: 24px;
      border: none;
      resize: none;
      font-family: 'SFMono-Regular', 'Consolas', 'Menlo', 'Meiryo', monospace;
      font-size: 14px;
      line-height: 1.7;
      background: var(--bg);
      color: var(--fg);
      outline: none;
    }

    .editor::placeholder { color: var(--fg-faint); }
    .editor.hidden { display: none; }

    /* preview (表示モード) */
    .preview {
      flex: 1;
      padding: 40px 24px 80px;
      overflow-y: auto;
      background: var(--bg);
      -webkit-overflow-scrolling: touch;
    }

    .preview.hidden { display: none; }

    /* 読みやすい行幅：本文を中央カラムに制限 */
    .preview-inner {
      max-width: 760px;
      margin: 0 auto;
      font-size: 16.5px;
      line-height: 1.85;
    }

    .preview-empty {
      color: var(--fg-faint);
      text-align: center;
      padding: 60px 20px;
      font-size: 15px;
    }

    .preview-empty strong { color: var(--fg-soft); display: block; margin-bottom: 8px; font-size: 17px; }

    /* マークダウンレンダリング */
    .preview-inner h1, .preview-inner h2, .preview-inner h3,
    .preview-inner h4, .preview-inner h5, .preview-inner h6 {
      margin-top: 1.8em;
      margin-bottom: 0.6em;
      color: var(--heading);
      line-height: 1.35;
      font-weight: 700;
      scroll-margin-top: 16px;
    }

    .preview-inner h1, .preview-inner h2 {
      border-bottom: 1px solid var(--rule);
      padding-bottom: 0.3em;
    }

    .preview-inner h1:first-child, .preview-inner h2:first-child,
    .preview-inner h3:first-child { margin-top: 0; }

    .preview-inner h1 { font-size: 1.75em; }
    .preview-inner h2 { font-size: 1.45em; }
    .preview-inner h3 { font-size: 1.22em; }
    .preview-inner h4 { font-size: 1.08em; }
    .preview-inner h5, .preview-inner h6 { font-size: 1em; color: var(--fg-soft); }

    .preview-inner p { margin-bottom: 1.15em; }
    .preview-inner ul, .preview-inner ol { margin-bottom: 1.15em; padding-left: 1.6em; }
    .preview-inner li { margin-bottom: 0.4em; }
    .preview-inner li > ul, .preview-inner li > ol { margin-top: 0.4em; margin-bottom: 0.4em; }

    .preview-inner code {
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'SFMono-Regular', 'Consolas', 'Menlo', monospace;
      font-size: 0.88em;
      color: var(--code-fg);
    }

    .preview-inner pre {
      background: var(--pre-bg);
      padding: 16px 18px;
      border-radius: 8px;
      overflow-x: auto;
      margin-bottom: 1.3em;
      line-height: 1.6;
      -webkit-overflow-scrolling: touch;
    }

    .preview-inner pre code {
      background: none;
      padding: 0;
      color: var(--pre-fg);
      font-size: 0.9em;
    }

    .preview-inner blockquote {
      border-left: 4px solid var(--quote-bar);
      padding: 0.2em 0 0.2em 16px;
      margin: 1.3em 0;
      color: var(--quote-fg);
    }

    .preview-inner blockquote p:last-child { margin-bottom: 0; }

    .preview-inner a { color: var(--link); text-decoration: none; }
    .preview-inner a:hover { text-decoration: underline; }

    .preview-inner table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 1.3em;
      display: block;
      overflow-x: auto;
      font-size: 0.95em;
    }

    .preview-inner th, .preview-inner td {
      border: 1px solid var(--rule);
      padding: 9px 12px;
      text-align: left;
    }

    .preview-inner th { background: var(--th-bg); font-weight: 700; }
    .preview-inner hr { border: none; border-top: 1px solid var(--rule); margin: 2.2em 0; }
    .preview-inner img { max-width: 100%; border-radius: 8px; height: auto; }

    /* スクロールバー */
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: var(--scroll-track); }
    ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-h); }

    /* ==================== スマホ向け調整 ==================== */
    @media (max-width: 600px) {
      .header { min-height: 46px; }
      .file-tab { min-width: 84px; max-width: 150px; font-size: 12px; padding: 0 8px; }
      .tab-add { padding: 0 12px; }
      .mode-switcher { padding: 0 6px; gap: 4px; }
      .mode-btn, .toc-toggle { padding: 9px 10px; font-size: 14px; }
      .toc-toggle { margin-right: 2px; }
      .btn-label { display: none; }
      .preview { padding: 22px 18px 70px; }
      .preview-inner { font-size: 16px; line-height: 1.8; }
      .editor { padding: 16px; }
      /* 目次はオーバーレイ表示にして画面を広く使う */
      .toc-sidebar {
        position: absolute;
        top: 0; left: 0;
        height: 100%;
        width: 76vw;
        max-width: 270px;
        z-index: 30;
        box-shadow: 4px 0 16px rgba(0,0,0,.4);
      }
      .toc-list a { padding: 10px 8px; font-size: 13.5px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="tab-bar" id="tabBar"></div>
    <button class="tab-add" id="tabAdd" title="新規タブ (Ctrl+T)">+</button>
    <div class="mode-switcher">
      <button class="mode-btn" id="openBtn" title="ファイルを開く（Google Driveも選べます）">📂 <span class="btn-label">開く</span></button>
      <button class="toc-toggle" id="tocToggle" title="目次の表示切替 (Ctrl+B)">📑 <span class="btn-label">目次</span></button>
      <button class="mode-btn" id="editModeBtn" title="貼付モード (Ctrl+E)">📝 <span class="btn-label">貼付</span></button>
      <button class="mode-btn" id="viewModeBtn" title="表示モード (Ctrl+Enter)">👁 <span class="btn-label">表示</span></button>
      <button class="mode-btn" id="themeBtn" title="テーマ切替（ライト/ダーク）"></button>
    </div>
  </header>
  <input type="file" id="fileInput" accept=".md,.markdown,.txt,text/markdown,text/plain" multiple>

  <div class="main">
    <aside class="toc-sidebar hidden" id="tocSidebar">
      <div class="toc-title">目次</div>
      <ul class="toc-list" id="tocList"></ul>
    </aside>
    <div class="content">
      <textarea class="editor" id="editor" placeholder="ここにマークダウン文章を貼り付け、または「📂 開く」でファイルを読み込んでください..."></textarea>
      <div class="preview hidden" id="preview"></div>
    </div>
  </div>

  <script>
    // ==================== 状態管理 ====================
    const STORAGE_KEY = 'md-viewer-state';

    function generateId() {
      return 'tab-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
    }

    function defaultState() {
      const id = generateId();
      return {
        activeTabId: id,
        tabs: [{ id, name: 'メモ1', content: '' }],
        mode: 'edit',
        tocOpen: true,
        theme: 'light'
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        if (!parsed.tabs || parsed.tabs.length === 0) return defaultState();
        if (!parsed.tabs.find(t => t.id === parsed.activeTabId)) {
          parsed.activeTabId = parsed.tabs[0].id;
        }
        if (parsed.mode !== 'edit' && parsed.mode !== 'preview') parsed.mode = 'edit';
        if (typeof parsed.tocOpen !== 'boolean') parsed.tocOpen = true;
        if (parsed.theme !== 'light' && parsed.theme !== 'dark') parsed.theme = 'light';
        return parsed;
      } catch (e) {
        console.error('状態の読込に失敗:', e);
        return defaultState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error('状態の保存に失敗:', e);
      }
    }

    let state = loadState();
    let saveTimer = null;
    function scheduleSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveState, 500);
    }

    function activeTab() {
      return state.tabs.find(t => t.id === state.activeTabId) || state.tabs[0];
    }

    function isSmallScreen() {
      return window.matchMedia('(max-width: 600px)').matches;
    }

    // テーマは描画前に当てて初回チラつきを防ぐ
    document.documentElement.setAttribute('data-theme', state.theme);

    // ==================== DOM参照 ====================
    const tabBar = document.getElementById('tabBar');
    const tabAddBtn = document.getElementById('tabAdd');
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const editBtn = document.getElementById('editModeBtn');
    const viewBtn = document.getElementById('viewModeBtn');
    const openBtn = document.getElementById('openBtn');
    const themeBtn = document.getElementById('themeBtn');
    const fileInput = document.getElementById('fileInput');
    const tocToggleBtn = document.getElementById('tocToggle');
    const tocSidebar = document.getElementById('tocSidebar');
    const tocList = document.getElementById('tocList');

    // ==================== marked設定 ====================
    marked.setOptions({ breaks: true, gfm: true });

    // ==================== テーマ ====================
    function applyTheme() {
      document.documentElement.setAttribute('data-theme', state.theme);
      const isLight = state.theme === 'light';
      themeBtn.innerHTML = (isLight ? '🌙 ' : '☀️ ') + '<span class="btn-label">' + (isLight ? 'ダーク' : 'ライト') + '</span>';
      themeBtn.title = isLight ? 'ダークテーマに切替' : 'ライトテーマに切替';
    }

    // ステータスバー色（meta theme-color）
    // 端末のライト/ダーク設定だけで決める（画面幅では切り替えない）。
    // Chrome はスマホ幅では theme-color の明るさから、タブレット幅では端末設定から
    // アイコン色を決めるため、端末設定に合わせた色にしておけばどちらの幅でも読める。
    // 値はヘッダー（--ui-bg）と同じ色にして一体化させる。
    //
    // 折りたたみ端末の開閉（画面リサイズ）後、Chrome が theme-color の変更を取りこぼして
    // 内部の既定色に戻る問題への対処として、リサイズ時は <meta> 要素そのものを
    // 削除して作り直し、Chrome に色の再計算を強制する。
    const systemDarkQuery = window.matchMedia('(prefers-color-scheme: dark)');

    function currentThemeColor() {
      return systemDarkQuery.matches ? '#1f2733' : '#e8ecf1';
    }

    function updateThemeColor() {
      const meta = document.querySelector('meta[name="theme-color"]');
      if (!meta) return;
      meta.setAttribute('content', currentThemeColor());
    }

    // <meta name="theme-color"> を DOM から削除して再生成する
    function reinsertThemeColor() {
      const old = document.querySelector('meta[name="theme-color"]');
      if (old) old.remove();
      const meta = document.createElement('meta');
      meta.name = 'theme-color';
      meta.content = currentThemeColor();
      document.head.appendChild(meta);
    }

    // 連続する resize を 1 回にまとめ、描画が落ち着いてから再挿入する
    let themeColorReinsertTimer = null;
    function scheduleThemeColorReinsert() {
      clearTimeout(themeColorReinsertTimer);
      themeColorReinsertTimer = setTimeout(reinsertThemeColor, 300);
    }

    systemDarkQuery.addEventListener('change', updateThemeColor);
    window.addEventListener('resize', scheduleThemeColorReinsert);
    window.addEventListener('orientationchange', scheduleThemeColorReinsert);
    // 折りたたみ開閉後にアプリへ戻ってきた場合の保険
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') scheduleThemeColorReinsert();
    });

    function toggleTheme() {
      state.theme = state.theme === 'light' ? 'dark' : 'light';
      saveState();
      applyTheme();
    }

    // ==================== タブ描画 ====================
    function renderTabs() {
      tabBar.innerHTML = '';
      state.tabs.forEach(tab => {
        const el = document.createElement('div');
        el.className = 'file-tab' + (tab.id === state.activeTabId ? ' active' : '');
        el.dataset.tabId = tab.id;

        const nameEl = document.createElement('span');
        nameEl.className = 'tab-name';
        nameEl.textContent = tab.name;
        el.appendChild(nameEl);

        if (state.tabs.length > 1) {
          const closeBtn = document.createElement('button');
          closeBtn.className = 'tab-close';
          closeBtn.textContent = '×';
          closeBtn.title = 'タブを閉じる';
          closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeTab(tab.id);
          });
          el.appendChild(closeBtn);
        }

        el.addEventListener('click', () => setActiveTab(tab.id));
        el.addEventListener('dblclick', (e) => {
          e.preventDefault();
          startRename(tab.id, el);
        });
        tabBar.appendChild(el);
      });
    }

    function startRename(tabId, tabEl) {
      const tab = state.tabs.find(t => t.id === tabId);
      if (!tab) return;
      tabEl.innerHTML = '';
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'tab-name-input';
      input.value = tab.name;
      tabEl.appendChild(input);
      input.focus();
      input.select();

      const finish = (commit) => {
        const newName = input.value.trim();
        if (commit && newName) tab.name = newName;
        saveState();
        renderTabs();
      };
      input.addEventListener('blur', () => finish(true));
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); finish(true); }
        else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
      });
    }

    function setActiveTab(id) {
      if (!state.tabs.find(t => t.id === id)) return;
      state.activeTabId = id;
      saveState();
      renderTabs();
      syncEditorFromState();
      if (state.mode === 'preview') updatePreview();
    }

    function uniqueName(base) {
      const root = (base || 'メモ').trim() || 'メモ';
      let name = root;
      let i = 2;
      while (state.tabs.find(t => t.name === name)) {
        name = root + ' (' + i + ')';
        i++;
      }
      return name;
    }

    function addTab() {
      const n = state.tabs.length + 1;
      const newTab = { id: generateId(), name: uniqueName('メモ' + n), content: '' };
      state.tabs.push(newTab);
      state.activeTabId = newTab.id;
      saveState();
      renderTabs();
      syncEditorFromState();
      if (state.mode === 'preview') updatePreview();
      if (state.mode === 'edit' && !isSmallScreen()) editor.focus();
    }

    function closeTab(id) {
      if (state.tabs.length <= 1) return;
      const idx = state.tabs.findIndex(t => t.id === id);
      if (idx === -1) return;
      state.tabs.splice(idx, 1);
      if (state.activeTabId === id) {
        state.activeTabId = state.tabs[Math.max(0, idx - 1)].id;
      }
      saveState();
      renderTabs();
      syncEditorFromState();
      if (state.mode === 'preview') updatePreview();
    }

    // ==================== ファイルを開く（Google Drive等） ====================
    function readFileAsText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(reader.error || new Error('読込エラー'));
        reader.readAsText(file, 'utf-8');
      });
    }

    function stripExt(filename) {
      return filename.replace(/\.(md|markdown|mdown|txt)$/i, '') || filename;
    }

    async function openFiles(fileList) {
      const files = Array.from(fileList);
      if (files.length === 0) return;
      let lastId = null;
      for (const file of files) {
        let text;
        try {
          text = await readFileAsText(file);
        } catch (e) {
          alert('「' + file.name + '」を読み込めませんでした。\n' + (e && e.message ? e.message : ''));
          continue;
        }
        const baseName = stripExt(file.name);
        const act = activeTab();
        // 単一ファイルで、今のタブが空なら現在のタブに読み込む
        if (files.length === 1 && act && !act.content.trim()) {
          act.name = uniqueName(baseName);
          act.content = text;
          lastId = act.id;
        } else {
          const tab = { id: generateId(), name: uniqueName(baseName), content: text };
          state.tabs.push(tab);
          lastId = tab.id;
        }
      }
      if (lastId) state.activeTabId = lastId;
      state.mode = 'preview';
      saveState();
      renderTabs();
      syncEditorFromState();
      applyMode();
    }

    // ==================== モード切替 ====================
    function setMode(mode) {
      state.mode = mode;
      saveState();
      applyMode();
    }

    function applyMode() {
      const isEdit = state.mode === 'edit';
      editor.classList.toggle('hidden', !isEdit);
      preview.classList.toggle('hidden', isEdit);
      editBtn.classList.toggle('active', isEdit);
      viewBtn.classList.toggle('active', !isEdit);
      tocToggleBtn.classList.toggle('hidden', isEdit);
      applyToc();
      if (!isEdit) updatePreview();
      if (isEdit && !isSmallScreen()) editor.focus();
    }

    function applyToc() {
      const showToc = state.mode === 'preview' && state.tocOpen;
      tocSidebar.classList.toggle('hidden', !showToc);
      tocToggleBtn.classList.toggle('active', state.tocOpen);
    }

    function toggleToc() {
      state.tocOpen = !state.tocOpen;
      saveState();
      applyToc();
    }

    // ==================== editor同期 ====================
    function syncEditorFromState() {
      editor.value = activeTab().content;
    }

    function onEditorInput() {
      activeTab().content = editor.value;
      scheduleSave();
    }

    // ==================== プレビュー描画 ====================
    function updatePreview() {
      const content = activeTab().content;
      if (!content.trim()) {
        preview.innerHTML = '<div class="preview-empty"><strong>内容がありません</strong>「📂 開く」でファイルを読み込むか、「📝 貼付」でマークダウンを貼り付けてください</div>';
        updateToc();
        return;
      }
      preview.innerHTML = '<div class="preview-inner">' + marked.parse(content) + '</div>';
      assignHeadingIds();
      updateToc();
    }

    // ==================== TOC ====================
    function slugify(text) {
      return text.toLowerCase()
        .trim()
        .replace(/[\s　]+/g, '-')
        .replace(/[^\w\-぀-ゟ゠-ヿ一-龯]/g, '')
        .slice(0, 50) || 'h';
    }

    function assignHeadingIds() {
      const headings = preview.querySelectorAll('h1, h2, h3, h4, h5, h6');
      const used = new Set();
      headings.forEach(h => {
        let base = slugify(h.textContent);
        let id = base;
        let i = 1;
        while (used.has(id)) {
          id = base + '-' + i;
          i++;
        }
        used.add(id);
        h.id = id;
      });
    }

    function updateToc() {
      tocList.innerHTML = '';
      const headings = preview.querySelectorAll('h1, h2, h3, h4, h5, h6');
      if (headings.length === 0) {
        const li = document.createElement('li');
        li.innerHTML = '<div class="toc-empty">見出しがありません</div>';
        tocList.appendChild(li);
        return;
      }
      headings.forEach(h => {
        const level = parseInt(h.tagName.charAt(1), 10);
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        a.style.paddingLeft = (8 + (level - 1) * 12) + 'px';
        if (level === 1) a.style.fontWeight = '600';
        a.addEventListener('click', (e) => {
          e.preventDefault();
          h.scrollIntoView({ behavior: 'smooth', block: 'start' });
          if (isSmallScreen()) tocSidebar.classList.add('hidden');
        });
        li.appendChild(a);
        tocList.appendChild(li);
      });
    }

    // ==================== イベント結線 ====================
    editor.addEventListener('input', onEditorInput);
    tabAddBtn.addEventListener('click', addTab);
    editBtn.addEventListener('click', () => setMode('edit'));
    viewBtn.addEventListener('click', () => setMode('preview'));
    tocToggleBtn.addEventListener('click', toggleToc);
    openBtn.addEventListener('click', () => fileInput.click());
    themeBtn.addEventListener('click', toggleTheme);
    fileInput.addEventListener('change', (e) => {
      const files = e.target.files;
      if (files && files.length) openFiles(files);
      fileInput.value = '';
    });

    // 表示モード時、貼り付けたら自動的に表示モードでも反映する
    editor.addEventListener('paste', () => {
      setTimeout(() => {
        if (state.mode === 'preview') updatePreview();
      }, 0);
    });

    // ショートカット（PC用。スマホでは各ボタンで操作）
    document.addEventListener('keydown', (e) => {
      const ctrl = e.ctrlKey || e.metaKey;

      if (ctrl && e.key === 'e' && !e.shiftKey) {
        e.preventDefault();
        setMode('edit');
      } else if (ctrl && e.key === 'Enter') {
        e.preventDefault();
        setMode('preview');
      } else if (ctrl && e.key === 'o') {
        e.preventDefault();
        fileInput.click();
      } else if (ctrl && e.key === 't' && !e.shiftKey) {
        e.preventDefault();
        addTab();
      } else if (ctrl && e.key === 'w') {
        e.preventDefault();
        closeTab(state.activeTabId);
      } else if (ctrl && e.key === 'b') {
        e.preventDefault();
        if (state.mode === 'preview') toggleToc();
      } else if (ctrl && e.key === 'd') {
        e.preventDefault();
        toggleTheme();
      } else if (ctrl && e.key === 'Tab') {
        e.preventDefault();
        const idx = state.tabs.findIndex(t => t.id === state.activeTabId);
        const next = e.shiftKey
          ? (idx - 1 + state.tabs.length) % state.tabs.length
          : (idx + 1) % state.tabs.length;
        setActiveTab(state.tabs[next].id);
      }
    });

    // ==================== 初期化 ====================
    function init() {
      applyTheme();
      renderTabs();
      syncEditorFromState();
      applyMode();
      updateThemeColor();
    }

    init();

    // ==================== PWA: Service Worker 登録 ====================
    // file:// で開いた場合は登録できないので静かにスキップ
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW登録失敗', e));
      });
    }
  </script>
</body>
</html>
